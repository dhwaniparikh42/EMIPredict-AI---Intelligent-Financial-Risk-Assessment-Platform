name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Syntax check
        run: python -m compileall -q src train.py run_pipeline.py check_splits.py push_to_github.py

      - name: Guard - no data or MLflow files in the repo
        run: |
          if git ls-files | grep -E '^(data/(raw|processed)/[^.]|mlflow\.db$|mlartifacts/)'; then
            echo "::error::Data / MLflow files must not be committed (see .gitignore)"; exit 1
          fi

      - name: Unit tests (+ committed model smoke test)
        run: python -m pytest -q
